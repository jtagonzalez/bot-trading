<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gráfico en vivo</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0a0f; color:#e0e0e0;
    font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  #hdr {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px; background:#0f0f1a;
    border-bottom:1px solid rgba(255,255,255,0.07); flex-shrink:0;
  }
  #asset-name { font-size:20px; font-weight:800; }
  #asset-otc  { font-size:10px; color:rgba(255,255,255,0.3); margin-left:5px; vertical-align:super; }
  .badge {
    border-radius:12px; padding:3px 10px; font-size:11px; font-weight:700;
    display:inline-block;
  }
  #pay  { background:rgba(255,196,0,0.12); border:1px solid rgba(255,196,0,0.35); color:#ffc400; }
  #tf   { background:rgba(64,196,255,0.1); border:1px solid rgba(64,196,255,0.3); color:#40c4ff; margin-left:6px; }
  #price { font-size:22px; font-weight:800; font-family:monospace; transition:color .3s; min-width:110px; text-align:right; }
  #status { font-size:10px; color:rgba(255,255,255,0.25); margin-top:2px; text-align:right; }

  /* trade banner */
  #trade-banner {
    display:none; align-items:center; justify-content:space-between;
    padding:7px 18px; background:rgba(255,255,255,0.03);
    border-bottom:1px solid rgba(255,255,255,0.06); flex-shrink:0;
    font-size:12px;
  }
  #countdown { font-size:20px; font-weight:800; font-family:monospace; }

  /* legend */
  #legend {
    display:flex; gap:14px; padding:5px 18px;
    background:#0f0f1a; border-bottom:1px solid rgba(255,255,255,0.05);
    flex-shrink:0; font-size:10px;
  }
  .leg-item { display:flex; align-items:center; gap:5px; }
  .leg-dot  { width:10px; height:3px; border-radius:2px; }

  #chart-wrap { flex:1; position:relative; min-height:0; }
  #chart { width:100%; height:100%; }
  #loading {
    position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; color:rgba(255,255,255,0.3); font-size:14px;
    pointer-events:none;
  }
  #foot {
    text-align:center; padding:4px; font-size:10px;
    color:rgba(255,255,255,0.15); flex-shrink:0;
    border-top:1px solid rgba(255,255,255,0.04);
  }
</style>
</head>
<body>

<div id="hdr">
  <div>
    <span id="asset-name">—</span>
    <span id="asset-otc"></span>
    <span class="badge" id="pay">—</span>
    <span class="badge" id="tf">1 min</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
    <span id="price">—</span>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="status">Cargando...</span>
      <button id="btn-refresh"
        onclick="reconnect()"
        title="Reconectar y recargar velas"
        style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);
               border-radius:6px;color:rgba(255,255,255,0.55);font-size:11px;
               padding:2px 9px;cursor:pointer;transition:all .2s">
        ↺ Reconectar
      </button>
    </div>
  </div>
</div>

<!-- Solo visible cuando hay un trade activo -->
<div id="trade-banner">
  <div style="display:flex;align-items:center;gap:10px">
    <span id="trade-dir" style="font-weight:800;font-size:13px"></span>
    <span style="color:rgba(255,255,255,0.4)">·</span>
    <span>Monto: <b id="trade-monto"></b></span>
    <span>·</span>
    <span>Entrada: <b id="trade-entrada" style="font-family:monospace"></b></span>
    <span>·</span>
    <span>Paso: <b id="trade-paso"></b></span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:11px;color:rgba(255,255,255,0.4)">Expira en</span>
    <span id="countdown">—</span>
  </div>
</div>

<div id="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#00e676;height:3px"></div><span style="color:#00e676;font-weight:700">SMA 3</span><span id="val-sma3" style="color:rgba(255,255,255,0.4);font-family:monospace;font-size:9px;margin-left:3px"></span></div>
  <div class="leg-item"><div class="leg-dot" style="background:#40c4ff;height:3px"></div><span style="color:#40c4ff;font-weight:700">SMA 50</span><span id="val-sma50" style="color:rgba(255,255,255,0.4);font-family:monospace;font-size:9px;margin-left:3px"></span></div>
  <div class="leg-item" style="margin-left:8px"><div style="width:12px;height:2px;background:repeating-linear-gradient(90deg,#ff1744 0,#ff1744 4px,transparent 4px,transparent 7px)"></div><span style="color:rgba(255,255,255,0.4)">PUT entry</span></div>
  <div class="leg-item"><div style="width:12px;height:2px;background:repeating-linear-gradient(90deg,#00e676 0,#00e676 4px,transparent 4px,transparent 7px)"></div><span style="color:rgba(255,255,255,0.4)">CALL entry</span></div>
  <div class="leg-item" style="margin-left:auto"><span id="señal-badge" style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;display:none"></span></div>
</div>

<div id="chart-wrap">
  <div id="loading">⏳ Obteniendo velas...</div>
  <div id="chart"></div>
</div>

<div id="foot">Velas 1 min · Actualiza cada 5s · Zoom y scroll habilitados</div>

<script>
  const params  = new URLSearchParams(window.location.search);
  const ACTIVO  = params.get('activo')  || '';
  const PAYOUT  = params.get('payout')  || '—';

  document.title = ACTIVO.replace('-OTC','') + ' · Gráfico';
  document.getElementById('asset-name').textContent = ACTIVO.replace('-OTC','') || '—';
  document.getElementById('asset-otc').textContent  = ACTIVO.includes('OTC') ? 'OTC' : '';
  document.getElementById('pay').textContent  = PAYOUT + '% payout';

  // ── Crear gráfico ──────────────────────────────
  const wrap     = document.getElementById('chart');
  const wrapEl   = document.getElementById('chart-wrap');
  const getW = () => wrapEl.clientWidth  || wrap.clientWidth  || window.innerWidth;
  const getH = () => wrapEl.clientHeight || wrap.clientHeight || (window.innerHeight - 140);
  const chart = LightweightCharts.createChart(wrap, {
    width:  getW(),
    height: getH(),
    layout: { background:{ color:'#0d0d16' }, textColor:'#888' },
    grid:   { vertLines:{ color:'#161625' }, horzLines:{ color:'#161625' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor:'#222236' },
    timeScale: { borderColor:'#222236', timeVisible:true, secondsVisible:false },
    handleScroll: true, handleScale: true,
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor:'#00e676', downColor:'#ff1744',
    borderUpColor:'#00e676', borderDownColor:'#ff1744',
    wickUpColor:'#00e676', wickDownColor:'#ff1744',
  });
  // SMA 3 — verde brillante, más gruesa para ser visible
  const sma3Series = chart.addLineSeries({
    color:'#00e676', lineWidth:2, lineStyle:0,
    priceLineVisible:false, lastValueVisible:true, crosshairMarkerVisible:true,
    title:'SMA3',
  });
  // SMA 50 — cian, más gruesa
  const sma50Series = chart.addLineSeries({
    color:'#40c4ff', lineWidth:2, lineStyle:0,
    priceLineVisible:false, lastValueVisible:true, crosshairMarkerVisible:true,
    title:'SMA50',
  });

  let entryPriceLine = null;
  let expiryInterval = null;
  const priceEl     = document.getElementById('price');
  const statusEl    = document.getElementById('status');
  const loadEl      = document.getElementById('loading');
  const valSma3El   = document.getElementById('val-sma3');
  const valSma50El  = document.getElementById('val-sma50');
  const señalBadge  = document.getElementById('señal-badge');
  let lastClose     = null;

  function actualizarLeyenda(last) {
    if (last.sma3  != null) valSma3El.textContent  = last.sma3.toFixed(5);
    if (last.sma50 != null) valSma50El.textContent = last.sma50.toFixed(5);
    // Indicar visualmente si SMA3 está sobre o bajo SMA50
    if (last.sma3 != null && last.sma50 != null) {
      const alcista = last.sma3 > last.sma50;
      señalBadge.style.display = 'inline-block';
      señalBadge.textContent   = alcista ? '▲ SMA3 > SMA50' : '▼ SMA3 < SMA50';
      señalBadge.style.background = alcista ? 'rgba(0,230,118,0.15)' : 'rgba(255,23,68,0.15)';
      señalBadge.style.color      = alcista ? '#00e676' : '#ff1744';
      señalBadge.style.border     = `1px solid ${alcista ? 'rgba(0,230,118,0.3)' : 'rgba(255,23,68,0.3)'}`;
    }
  }

  function applyCandles(data) {
    if (!Array.isArray(data) || !data.length) return false;
    const ohlc = data.map(d => ({ time:d.time, open:d.open, high:d.high, low:d.low, close:d.close }));
    const s3   = data.filter(d => d.sma3  != null).map(d => ({ time:d.time, value:d.sma3  }));
    const s50  = data.filter(d => d.sma50 != null).map(d => ({ time:d.time, value:d.sma50 }));

    candleSeries.setData(ohlc);
    if (s3.length)  sma3Series.setData(s3);
    if (s50.length) sma50Series.setData(s50);

    const last = data[data.length - 1];
    const color = lastClose === null ? '#e0e0e0' : last.close >= lastClose ? '#00e676' : '#ff1744';
    priceEl.style.color  = color;
    priceEl.textContent  = last.close.toFixed(5);
    lastClose = last.close;
    statusEl.textContent = 'Actualizado ' + new Date().toLocaleTimeString('es');
    actualizarLeyenda(last);
    return true;
  }

  function updateCandles(data) {
    if (!Array.isArray(data) || !data.length) return;
    // LightweightCharts v4: update() solo acepta la vela más reciente.
    // Iterar todas lanzaría excepciones para velas anteriores → chart negro.
    // Solución: solo actualizar la última vela del lote.
    const last = data[data.length - 1];
    try {
      candleSeries.update({ time:last.time, open:last.open, high:last.high, low:last.low, close:last.close });
      if (last.sma3  != null) sma3Series.update({ time:last.time, value:last.sma3 });
      if (last.sma50 != null) sma50Series.update({ time:last.time, value:last.sma50 });
    } catch(e) {
      // Si la vela es antigua respecto al chart, hacer setData completo
      applyCandles(data);
      return;
    }
    const last = data[data.length - 1];
    const color = lastClose === null ? '#e0e0e0' : last.close >= lastClose ? '#00e676' : '#ff1744';
    priceEl.style.color  = color;
    priceEl.textContent  = last.close.toFixed(5);
    lastClose = last.close;
    statusEl.textContent = 'Actualizado ' + new Date().toLocaleTimeString('es');
    actualizarLeyenda(last);
  }

  // ── Trade activo ──────────────────────────────
  function mostrarTrade(trade) {
    if (!trade || !trade.activo) return;
    const banner = document.getElementById('trade-banner');
    const isCall = trade.direccion === 'call';
    const col    = isCall ? '#00e676' : '#ff1744';

    banner.style.display = 'flex';
    document.getElementById('trade-dir').innerHTML =
      `<span style="color:${col}">${isCall ? '▲ CALL' : '▼ PUT'}</span>`;
    document.getElementById('trade-monto').textContent  = '$' + Number(trade.monto||0).toFixed(2);
    document.getElementById('trade-entrada').textContent = Number(trade.precio_entrada||0).toFixed(5);
    document.getElementById('trade-paso').textContent   = trade.paso > 1 ? 'M'+trade.paso : '1';

    // Línea de entrada
    if (entryPriceLine) { try { candleSeries.removePriceLine(entryPriceLine); } catch(e){} }
    if (trade.precio_entrada) {
      entryPriceLine = candleSeries.createPriceLine({
        price: trade.precio_entrada,
        color: col, lineWidth:2, lineStyle:2,
        axisLabelVisible:true,
        title: isCall ? '▲ CALL entry' : '▼ PUT entry',
      });
    }

    // Countdown
    if (expiryInterval) clearInterval(expiryInterval);
    const cdEl = document.getElementById('countdown');
    const tick = () => {
      const diff = Math.max(0, Math.round((new Date(trade.ts_expira) - Date.now()) / 1000));
      const m = Math.floor(diff/60), s = diff % 60;
      cdEl.textContent = m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${s}s`;
      cdEl.style.color = diff <= 10 ? '#ff1744' : diff <= 30 ? '#ffc400' : '#00e676';
    };
    tick();
    expiryInterval = setInterval(tick, 500);
  }

  function limpiarTrade() {
    document.getElementById('trade-banner').style.display = 'none';
    if (entryPriceLine) { try { candleSeries.removePriceLine(entryPriceLine); } catch(e){} entryPriceLine = null; }
    if (expiryInterval) { clearInterval(expiryInterval); expiryInterval = null; }
  }

  function checkTrade() {
    fetch('/api/trades-vivos')
      .then(r => r.json())
      .then(lista => {
        const trade = lista.find(t => t.activo === ACTIVO);
        if (trade) mostrarTrade(trade); else limpiarTrade();
      })
      .catch(() => {});
  }

  // Carga inicial
  let initialLoaded = false;
  const btnRefresh  = document.getElementById('btn-refresh');

  function loadFull() {
    fetch('/api/candles?activo=' + encodeURIComponent(ACTIVO) + '&n=120')
      .then(r => r.json())
      .then(data => {
        if (data.length) {
          loadEl.style.display = 'none';
          initialLoaded = true;
          applyCandles(data);
          chart.timeScale().fitContent();
          btnRefresh.style.color = 'rgba(0,230,118,0.7)';
          setTimeout(() => { btnRefresh.style.color = 'rgba(255,255,255,0.55)'; }, 1500);
        } else {
          statusEl.textContent = 'Sin datos — reintentando...';
          btnRefresh.style.color = 'rgba(255,196,0,0.8)';
        }
      })
      .catch(() => {
        statusEl.textContent = 'Sin conexión con el bot';
        loadEl.textContent = '⚠️ Sin conexión — pulsa ↺ Reconectar';
        loadEl.style.display = 'flex';
        btnRefresh.style.color = '#ff1744';
      });
  }

  function reconnect() {
    btnRefresh.textContent = '↺ Conectando...';
    btnRefresh.style.color = '#ffc400';
    initialLoaded = false;
    loadEl.textContent = '⏳ Reconectando...';
    loadEl.style.display = 'flex';
    loadFull();
    checkTrade();
    setTimeout(() => { btnRefresh.textContent = '↺ Reconectar'; }, 2000);
  }

  loadFull();
  checkTrade();

  // Polling: 2s mientras no haya datos, 5s cuando ya cargó
  let retryCount = 0;
  function startPolling() {
    if (initialLoaded) {
      // modo normal: actualizar última vela cada 5s
      setInterval(() => {
        fetch('/api/candles?activo=' + encodeURIComponent(ACTIVO) + '&n=10')
          .then(r => r.json())
          .then(data => { if (data.length) { loadEl.style.display='none'; updateCandles(data); } })
          .catch(() => {});
        checkTrade();
      }, 5000);
    } else {
      // modo espera: reintentar carga completa cada 2s
      const waitId = setInterval(() => {
        retryCount++;
        loadEl.textContent = `⏳ Obteniendo velas... (intento ${retryCount})`;
        loadFull();
        checkTrade();
        if (initialLoaded) {
          clearInterval(waitId);
          startPolling(); // cambiar a modo normal
        }
      }, 2000);
    }
  }
  startPolling();

  // Resize — también aplica al init para corregir dimensión 0 en iframe
  const resizeChart = () => chart.applyOptions({ width: getW(), height: getH() });
  window.addEventListener('resize', resizeChart);
  // Múltiples intentos para cuando el iframe no tiene tamaño aún al cargar
  setTimeout(resizeChart, 50);
  setTimeout(resizeChart, 200);
  setTimeout(resizeChart, 600);
</script>
</body>
</html>
